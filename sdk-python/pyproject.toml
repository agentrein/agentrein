[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentrein"
version = "0.1.0"
description = "Automatic rollback for AI agents. Python SDK for AgentRein."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "AgentRein", email = "support@agentrein.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-mock",
    "mypy",
    "ruff",
]

[project.urls]
Homepage = "https://agentrein.com"
Repository = "https://github.com/agentrein/agentrein"

[tool.mypy]
strict = true

[tool.ruff]
line-length = 100
target-version = "py39"