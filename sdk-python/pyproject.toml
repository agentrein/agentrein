[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentrein"
version = "0.0.1"
description = "AI Agent Reliability Platform — Python SDK coming soon. See https://agentrein.com"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
keywords = ["ai", "agents", "reliability", "rollback", "observability"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]

[project.urls]
Homepage = "https://agentrein.com"
Documentation = "https://agentrein.com/docs"
Repository = "https://github.com/AgentReinAi"