name: Publish Types Package

on:
  push:
    tags:
      - "types-v*"

jobs:
  publish:
    name: Publish @agentrein/types to npm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy root LICENSE to types
        run: cp LICENSE types/LICENSE

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build types package
        run: npm run build --workspace types

      - name: Verify tag version matches package.json
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#types-v}"
          PKG_VERSION=$(node -p "require('./types/package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Error: Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)" >&2
            exit 1
          fi

          echo "Tag version ($TAG_VERSION) matches package.json version ($PKG_VERSION)"

      - name: Publish to npm
        run: npm publish --workspace types --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
