# This workflow runs on version tags (sdk-python-v*) or manual dispatch, uses PyPI Trusted Publishing
# (OIDC-based, requiring no stored credentials or API tokens), and expects
# the "pypi" GitHub environment to already exist in the repository settings.

name: Publish Python Package

on:
  workflow_dispatch:
  push:
    tags:
      - "sdk-python-v*"

jobs:
  build:
    name: Build Package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk-python

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy root LICENSE to sdk-python
        run: cp LICENSE sdk-python/LICENSE
        working-directory: .

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify tag version matches pyproject.toml
        run: |
          if [[ "${GITHUB_REF_NAME}" == sdk-python-v* ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#sdk-python-v}"
            PKG_VERSION=$(python -c "import tomllib; from pathlib import Path; print(tomllib.loads(Path('pyproject.toml').read_text())['project']['version'])")
            if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
              echo "Error: Tag version ($TAG_VERSION) does not match pyproject.toml version ($PKG_VERSION)" >&2
              exit 1
            fi
            echo "Tag version ($TAG_VERSION) matches pyproject.toml version ($PKG_VERSION)"
          fi

      - name: Install build tool
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade build

      - name: Build wheel and sdist
        run: python -m build

      - name: Store the distribution packages
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: sdk-python/dist/

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/agentrein
    permissions:
      id-token: write

    steps:
      - name: Download distribution packages
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
